function bwMap(c){var r=0,g=0,b=0;if(c[0]==='#'){var n=parseInt(c.slice(1),16);r=(n>>16)&255;g=(n>>8)&255;b=n&255;}else{var m=c.match(/rgba?\(([^)]+)\)/);if(m){var p=m[1].split(',');r=+p[0];g=+p[1];b=+p[2];}}return (r*3+g*6+b)>700?'#ffffff':'#000000';}

function pline(x1,y1,x2,y2,c){x1|=0;y1|=0;x2|=0;y2|=0;

/* ============ 翼：三指骨设计（原版角度）+ 展开放大系数 ============ */
function wing3(Sx,Sy,k,flap,sc){
  sc=sc||1;

/* 展开翼：两段翼臂(肱骨→前缘骨) + 腕部三根扇形翼指 + 扇贝形膜缘凹口（参考 Pixabay/PIXTA/像素金龙特征） */
/* ===== 展开翼：几何 → 扇形整面填充（零缝隙）→ 骨架置顶 =====
   解剖结构：弧形大骨(肩→肘肱骨→腕前臂骨) + 腕部辐射三根翼指
   膜三层：前臂膜(prop patagium) / 指间膜(dactylopatagium) / 后缘膜(plagiopatagium) */
function wingGeom(Sx,Sy,k,flap){
  var k2=.5+.5*k, phi=flap*.2;
  function rot(P){var dx=P[0]-Sx,dy=P[1]-Sy,c=Math.cos(phi),s=Math.sin(phi);
    return [Sx+dx*c-dy*s,Sy+dx*s+dy*c];}

  var W0=[E0[0]-16.9*k2,E0[1]-14.1*k2];            /* 腕：前臂骨末端=弧顶(后上方) */
  var d10=[W0[0]-24.4*k2,W0[1]-8.9*k2*(1+flap*.08)]; /* 指1 最长 向后微上仰 */
  var d20=[W0[0]-23.2*k2,W0[1]+6.2*k2];            /* 指2 接近水平向后 */
  var d30=[W0[0]-13.8*k2,W0[1]+11.6*k2];           /* 指3 向后下方 */
  var C0=[Sx-26,Sy+4];                             /* 后缘最深点(躯干左侧露出) */
  var F0=[Sx-13,Sy+13];                            /* 体侧收束点(藏进躯干,膜停于背线) */
  var c10=[W0[0]+4.9,W0[1]-3.4],c20=[W0[0]+0.7,W0[1]-4.0]; /* 拇指爪(朝前) */
  return {E:rot(E0),W:rot(W0),d1:rot(d10),d2:rot(d20),d3:rot(d30),
          C:rot(C0),F:rot(F0),c1:rot(c10),c2:rot(c20)};
}
/* 第一阶段：整面扇形基底（深色铺满零缝隙）+ 亮色覆膜分区 + 扇贝凹口 */
function spreadWingFill(Sx,Sy,g){
  var E=g.E,W=g.W,d1=g.d1,d2=g.d2,d3=g.d3,C=g.C,F=g.F;
  /* 整个翼面 = 一个简单多边形，path 一次填充，数学上零缝隙；
     尾缘 指3→C(后缘最深,躯干顶高度) →F(收束进体侧) →闭合(藏于躯干后)，不拖地不遮腿 */
  ctx.fillStyle=WINGD;
  ctx.beginPath();
  ctx.moveTo(Sx,Sy);                 /* 翼根 */
  ctx.lineTo(E[0],E[1]);             /* 沿弧形大骨前缘 */
  ctx.lineTo(W[0],W[1]);
  ctx.lineTo(d1[0],d1[1]);           /* 三根翼指外缘 */
  ctx.lineTo(d2[0],d2[1]);
  ctx.lineTo(d3[0],d3[1]);
  ctx.lineTo(C[0],C[1]);             /* 后缘垂坠最深(仅到躯干顶高) */
  ctx.lineTo(F[0],F[1]);             /* 收束进体侧(隐藏) */
  ctx.closePath();ctx.fill();

  tri(Sx,Sy,E[0],E[1],W[0],W[1],WING);        /* 前臂膜 */
  tri(W[0],W[1],d1[0],d1[1],d2[0],d2[1],WING); /* 指间膜1 */
  tri(W[0],W[1],d2[0],d2[1],d3[0],d3[1],WING); /* 指间膜2 */
  /* 扇贝凹口（沿膜后缘的柔和阴影） */
  function notch(ax,ay,bx2,by2,dep){
    var mx=(ax+bx2)/2,my=(ay+by2)/2;
    tri(ax,ay,bx2,by2,mx+(W[0]-mx)*dep,my+(W[1]-my)*dep,'#5e1410');
  }

}
/* 第二阶段：骨架线条置顶（清晰不糊） */
function spreadWingBones(Sx,Sy,g){
  var E=g.E,W=g.W,d1=g.d1,d2=g.d2,d3=g.d3;
  plineT(Sx,Sy,E[0],E[1],R,3);                       /* 肱骨(粗) */

  pline(W[0],W[1],d1[0],d1[1],WINGD);pline(W[0],W[1],d2[0],d2[1],WINGD);pline(W[0],W[1],d3[0],d3[1],WINGD);
  pline(d1[0],d1[1],d2[0],d2[1],WINGD);pline(d2[0],d2[1],d3[0],d3[1],WINGD);pline(d3[0],d3[1],g.C[0],g.C[1],WINGD);
  pline(Sx,Sy,E[0],E[1],R2);pline(E[0],E[1],W[0],W[1],R2);   /* 前缘高光 */
  tri(W[0],W[1],g.c1[0],g.c1[1],g.c2[0],g.c2[1],HORN);       /* 拇指爪 */
  px(d1[0]-1,d1[1]-1,3,3,HORN);px(d1[0],d1[1],1,1,'#000');   /* 翼尖爪 */

function dragon(x,y,act,t,face,alpha,sc){
  var A={idle:3,walk:2,takeoff:2.4,flight:3,fire:2.6,roar:2.6,hit:2,fade:2.6}[act]||3;
  t=t%A;
  face=face||1;alpha=(alpha===undefined)?1:alpha;sc=sc||1;
  ctx.save();ctx.translate(x,y);ctx.scale(face*sc,sc);ctx.globalAlpha=alpha;
  var legMode='stand',bobY=0,wingK=.06,jaw=0,neckDX=0,neckDY=0,
      headUp=0,recoil=0,squint=0,tuck=false,flap=0,
      chestDY=0,midDY=0,hipsDY=0,takeP=0;
  if(act==='idle'){chestDY=Math.sin(t*2.2)*1.2;}
  else if(act==='walk'){legMode='walk';bobY=-Math.abs(Math.sin(t*6.3))*1.2;
    chestDY=Math.sin(t*6.3)*1;hipsDY=-Math.sin(t*6.3)*1;}

    if(p<.35){var q=p/.35;bobY=q*4;chestDY=q*3;midDY=q*2;}
    else if(p<.7){var q2=(p-.35)/.35;wingK=.06+q2*.7;
      bobY=4-q2*12;chestDY=3-q2*7;midDY=2-q2*4;}
    else{wingK=.76+Math.sin((p-.7)/.3*Math.PI*2)*.22;
      flap=Math.sin(t*6);bobY=-8;chestDY=Math.sin(t*5)*1.5;}
  }
  else if(act==='flight'){bobY=-8+Math.sin(t*2.4)*2;wingK=1;
    flap=Math.sin(t*6);tuck=true;chestDY=-2+Math.sin(t*2.4+1)*1.2;}
  else if(act==='sleep'){headUp=-1.5;wingK=.03;jaw=0;
    chestDY=Math.round(Math.sin(t*1.1)*1.5);}

  }

    chestDY=-3+Math.sin(t*8)*1;}

  var sk=act==='flight'?1:Math.min(1,Math.max(0,(takeP-.35)/.35));
  var wg=useSpread?wingGeom(Sx,Sy,sk,flap):null;

  plineT(-38,-8+sway*1.4,-48,-12+sway*1.8,R,2);

  px(-12,-10+midDY,13,2,RD);
  px(-1,-10+chestDY,14,2,RD);

  if(squint){px(hx+6,hy+3,2,1,MOU);px(hx+9,hy+3,2,1,MOU);}
  else if(act==='sleep'){px(hx+6,hy+4,3,1,RD);}
  else if(act==='wake'){px(hx+5,hy+3,4,2,EYE);px(hx+7,hy+4,1,1,'#000');px(hx+5,hy+3,1,1,'#fff');}

/* ================= 音效系统（Web Audio 全合成·无 BGM） ================= */
var AC=null,MASTER_G=null,muted=false;
var AMB={};  /* 环境层句柄 */
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER_G=AC.createGain();MASTER_G.gain.value=.75;MASTER_G.connect(AC.destination);}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function t0(){return AC?AC.currentTime:0;}
function toneF(f,d,type,peak,f2,dl){
  if(!AC||muted)return;var t=t0()+(dl||0);
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak||.15,t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(MASTER_G);o.start(t);o.stop(t+d+.05);
}
function noiseF(d,peak,fc,type,dl,q){
  if(!AC||muted)return;var t=t0()+(dl||0);
  var n=(AC.sampleRate*d)|0,buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);
  for(var i=0;i<n;i++)ch[i]=Math.random()*2-1;
  var s=AC.createBufferSource();s.buffer=buf;
  var f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc||800;if(q)f.Q.value=q;
  var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak||.2,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(MASTER_G);s.start(t);
}
/* 短音效字典 */
function sShing(dl){toneF(1568,.5,'sine',.10,2093,dl);toneF(2637,.35,'sine',.06,null,dl);noiseF(.25,.10,5000,'highpass',dl);}
function sBoom(dl){toneF(58,.9,'sine',.30,30,dl);noiseF(.7,.22,300,'lowpass',dl);}
function sCrash(dl){noiseF(.5,.20,1800,'bandpass',dl,0.8);}
function sWhoosh(d,dl){noiseF(d||.5,.14,1200,'bandpass',dl,1.2);}
function sRiser(d,dl){noiseF(d||.8,.16,400,'bandpass',dl,2);toneF(200,(d||.8),'sine',.08,900,dl);}
function sRoar(dl){toneF(70,1.3,'sawtooth',.20,52,dl);toneF(96,1.1,'square',.10,70,dl+.1);noiseF(1.3,.20,500,'lowpass',dl);}
function sSnort(dl){noiseF(.22,.22,500,'lowpass',dl);toneF(140,.2,'square',.12,80,dl);}
function sCrack(dl){noiseF(.09,.16,2500,'bandpass',dl,3);}
function sChime(fq,dl){toneF(fq,.6,'sine',.10,null,dl);toneF(fq*2,.3,'sine',.04,null,dl);}
function sGlissDown(dl){toneF(1200,.5,'sine',.08,300,dl);}
function sSlideWhistle(dl){toneF(900,.45,'sine',.12,280,dl);}   /* 被甩飞 */
function sBoing(dl){toneF(150,.35,'triangle',.14,90,dl);toneF(90,.25,'triangle',.10,150,dl+.12);} /* 坐地 */
function sSigh(dl){toneF(420,.4,'sine',.08,220,dl);}             /* 叹气 */
function sGrunt(dl){toneF(180,.12,'square',.10,140,dl);}
function sSnap(dl){noiseF(.06,.18,3000,'highpass',dl);toneF(300,.08,'square',.10,180,dl);}
function sGlub(dl){toneF(300,.25,'sine',.14,90,dl);}
function sHiss(dl){noiseF(.6,.08,4000,'highpass',dl);}
function sBird(dl){var f=2200+Math.random()*1200;toneF(f,.09,'sine',.05,f*1.4,dl);toneF(f*1.3,.08,'sine',.04,f,dl+.1);}
function sCheer(dl){noiseF(.8,.18,900,'bandpass',dl,0.6);[660,880,990,880,1100].forEach(function(f,i){toneF(f,.15,'sine',.04,f*1.05,dl+.05+i*.09);});}
function sClap(dl){noiseF(.05,.16,1500,'bandpass',dl,1.5);}
function sFootstep(dl){noiseF(.05,.05,500,'lowpass',dl);}
/* 环境层 */
function ambWind(on){if(!AC)return;if(on&&!AMB.wind){var s=AC.createBufferSource(),n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(var i=0;i<n;i++)c[i]=Math.random()*2-1;s.buffer=b;s.loop=true;var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=400;var g=AC.createGain();g.gain.value=.045;var l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.13;lg.gain.value=.02;l.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(MASTER_G);s.start();l.start();AMB.wind={s:s,l:l,g:g};}else if(!on&&AMB.wind){try{AMB.wind.s.stop();AMB.wind.l.stop();}catch(e){}AMB.wind=null;}}
function ambLava(on){if(!AC)return;if(on&&!AMB.lava){var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=64;o2.type='sine';o2.frequency.value=91;var l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.7;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);g.gain.value=.05;o.connect(g);o2.connect(g);g.connect(MASTER_G);o.start();o2.start();l.start();AMB.lava={o:o,o2:o2,l:l};}else if(!on&&AMB.lava){try{AMB.lava.o.stop();AMB.lava.o2.stop();AMB.lava.l.stop();}catch(e){}AMB.lava=null;}}
var birdTimer=null;
function ambBirds(on){if(on&&!birdTimer){birdTimer=setInterval(function(){if(playing&&!muted&&Math.random()<.75)sBird(0);},1500);}else if(!on&&birdTimer){clearInterval(birdTimer);birdTimer=null;}}
function ambFire(on){if(!AC)return;if(on&&!AMB.fire){var n=AC.sampleRate*1,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(var i=0;i<n;i++)c[i]=Math.random()*2-1;var s=AC.createBufferSource();s.buffer=b;s.loop=true;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=.8;var g=AC.createGain();g.gain.value=.11;var l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=9;lg.gain.value=.05;l.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(MASTER_G);s.start();l.start();AMB.fire={s:s,l:l};}else if(!on&&AMB.fire){try{AMB.fire.s.stop();AMB.fire.l.stop();}catch(e){}AMB.fire=null;}}

];
var TOTAL=0,ACC=[];
for(var i=0;i<10;i++){ACC.push(TOTAL);TOTAL+=SCN[i][1];}
var subEl=document.getElementById('sub'),hudEl=document.getElementById('hud2'),barEl=document.getElementById('bar');
function render(T){
  var idx=0,lt=0;
  for(var i=0;i<10;i++){if(T<ACC[i]+SCN[i][1]){idx=i;lt=T-ACC[i];break;}}
  SWOWN=(idx===1||idx===3)?0:1;   /* 第2幕入场+第4幕拔剑全程无佩剑(手中唯石中剑) */
  fireCues(T);
  var f=eval(SCN[idx][0]);f(lt);
  /* 幕间黑场 */
  var fd=0.4;
  if(lt<fd){ctx.globalAlpha=1-lt/fd;px(0,0,W,H,'#000');ctx.globalAlpha=1;}
  if(SCN[idx][1]-lt<fd){ctx.globalAlpha=1-(SCN[idx][1]-lt)/fd;px(0,0,W,H,'#000');ctx.globalAlpha=1;}
  /* 字幕/抬头/进度 */
  var cues=SCN[idx][2],cur=cues[0][1];
  for(var ci2=0;ci2<cues.length;ci2++){if(lt>=cues[ci2][0])cur=cues[ci2][1];}
  if(subEl.textContent!==cur)subEl.textContent=cur;
  hudEl.textContent='SCENE '+(idx+1)+'/10';
  barEl.style.width=(T/TOTAL*100)+'%';
}
function loop(now){
  if(!playing)return;
  var T=((now===undefined?performance.now():now)-startAt)/1000;
  if(T>=TOTAL){finish();return;}
  render(T);
  requestAnimationFrame(loop);
}
function finish(){
  playing=false;
  document.getElementById('cover').style.display='flex';
  document.querySelector('#cover .small').textContent='放映结束 · 点击重映';
}
function play(){
  document.getElementById('cover').style.display='none';
  au();firedCues=0;
  playing=true;startAt=performance.now();
  requestAnimationFrame(loop);
}
function togglePause(){
  if(!playing&&!pauseAt)return;
  if(playing){playing=false;pauseAt=performance.now();ambWind(false);ambBirds(false);ambLava(false);ambFire(false);}
  else{playing=true;startAt+=performance.now()-pauseAt;requestAnimationFrame(loop);}
}
document.getElementById('playBtn').addEventListener('click',function(e){e.stopPropagation();play();});
document.getElementById('muteB').addEventListener('click',function(e){e.stopPropagation();muted=!muted;this.textContent=muted?'🔇 音效关':'🔊 音效开';if(muted){ambWind(false);ambBirds(false);ambLava(false);ambFire(false);}});
cv.addEventListener('click',togglePause);
function fit(){
  var stage=document.getElementById('stage');
  var vw=window.innerWidth,vh=window.innerHeight;
  if(vh>vw){
    var w=Math.min(vh*0.94, vw*0.94*256/144, 1024);
    stage.style.width=w+'px';
    var s=Math.min(vw/(w*144/256), vh/w);
    stage.style.transform='rotate(90deg) scale('+s+')';
  } else {
    stage.style.transform='none';
    stage.style.width=Math.min(vw*0.94,1024)+'px';
  }
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,100);});
fit();
